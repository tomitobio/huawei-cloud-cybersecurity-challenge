services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: huawei_cyberchallenge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workshop -d huawei_cyberchallenge']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://workshop:workshop@db:5432/huawei_cyberchallenge?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
